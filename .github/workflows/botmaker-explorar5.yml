name: Botmaker - explorar API 5 (variáveis e tipificação)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler estrutura da API (sem gravar conteúdo)
        env:
          BOTMAKER_TOKEN_UVA: ${{ secrets.UNIVERSIDADEVEIGAALMEIDA }}
          BOTMAKER_TOKEN_UJ: ${{ secrets.UNIJORGE }}
        run: node servidor/botmaker/explorar5.mjs
      - name: Salvar resultado no repositório
        run: |
          git config user.name "robo-botmaker"
          git config user.email "robo@users.noreply.github.com"
          git add servidor/botmaker/resultado/esquema5.json
          git commit -m "Estrutura da API Botmaker" || echo "sem mudanças"
          git pull --rebase
          git push
