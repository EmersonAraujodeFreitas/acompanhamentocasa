function opRows(){const T=fX('tab'),PA=fX('pau'),DS=fX('dsc'),NP=fX('nps');const m=new Map(),L2N=new Map();for(const r of PA)if(r.lg&&r.nm)L2N.set(r.lg,r.nm);
const names=[...new Set([...T.map(r=>r.ag),...PA.map(r=>r.nm),...DS.map(r=>r.ag)].filter(Boolean))];const tok=n=>AX(n).split(' ');
const byFL=new Map();for(const n of names){const t=tok(n);byFL.set(t[0]+'.'+t[t.length-1],n)}
const res=lg=>{const n=L2N.get(lg);if(n)return n;const p=lg.split('.');return byFL.get(AX(p[0])+'.'+AX(p[p.length-1]))||lg};
const keys=[],memo=new Map(),lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]},canon=n=>{let k=memo.get(n);if(k)return k;const a=AX(n);k=keys.find(x=>x==a||(a.length>8&&Math.abs(x.length-a.length)<=2&&x[0]==a[0]&&lev(x,a)<=2))||a;if(!keys.includes(k))keys.push(k);memo.set(n,k);return k};
const get=n=>{const k=canon(n);let o=m.get(k);if(!o)m.set(k,o={nm:n,n:0,pr:0,tr:0,ok:0,du:0,dn:0,wr:0,pa:0,pn:0,ds:0,da:0,ns:0,nn:0});if(n.length>o.nm.length)o.nm=n;return o};
for(const r of T){if(!r.ag)continue;const o=get(r.ag);o.n++;o.tr+=r.tr;o.ok+=r.ok;if(!imp(r)){o.pr++;o.wr+=r.wr;if(r.du>0){o.du+=r.du;o.dn++}}}
for(const r of PA){if(!r.nm)continue;const o=get(r.nm);o.pa+=r.t;o.pn++}
for(const r of DS){if(!r.ag)continue;const o=get(r.ag);o.ds++;if(r.ow=='Agente')o.da++}
for(const r of NP){if(!r.lg||r.nt<1)continue;const o=get(res(r.lg));o.ns+=r.nt;o.nn++}
return[...m.values()]}
